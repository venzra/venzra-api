service: venzra-api

provider:
  name: aws
  runtime: nodejs8.10
  region: eu-west-1
  memorySize: 128
  timeout: 5
  environment:
    ADMIN_URL: ${file(./config.json):${opt:stage}.ADMIN_URL}
    CONTACT_EMAIL: ${file(./config.json):${opt:stage}.CONTACT_EMAIL}
    DB_URI: ${file(./config.json):${opt:stage}.DB_URI}
    MARKETING_URL: ${file(./config.json):${opt:stage}.MARKETING_URL}
    REPLY_TO: ${file(./config.json):${opt:stage}.REPLY_TO}
  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "ses:SendEmail"
      Resource: '*'

package:
  exclude:
    - "**/*.ts"
    - "*"
  include:
    - "src/**/*.js"
    - "src/**/*.md"
    - "src/**/*.ejs"

plugins:
  - serverless-domain-manager
  - serverless-plugin-typescript
  - serverless-offline

functions:
  admin:
    description: 'Venzra Admin API'
    handler: src/lambda-admin.api
    events:
      - http: ANY /admin
      - http: ANY /admin/{proxy+}
  website:
    description: 'Venzra Website API'
    handler: src/lambda-website.api
    events:
      - http: ANY /website
      - http: ANY /website/{proxy+}

custom:
  customDomain:
    domainName: ${file(./config.json):${opt:stage}.API_DOMAIN}
    basePath: ''
    stage: ${opt:stage}
    createRoute53Record: true
