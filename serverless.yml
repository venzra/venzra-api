service: venzra-api

provider:
  name: aws
  runtime: nodejs8.10
  region: eu-west-1
  memorySize: 256
  timeout: 5
  environment:
    ADMIN_URL: ${file(./config.json):${opt:stage}.ADMIN_URL}
    AWS_IMAGE_BUCKET: ${file(./config.json):${opt:stage}.AWS_IMAGE_BUCKET}
    CONTACT_EMAIL: ${file(./config.json):${opt:stage}.CONTACT_EMAIL}
    DB_URI: ${file(./config.json):${opt:stage}.DB_URI}
    DOMAIN: ${file(./config.json):${opt:stage}.DOMAIN}
    JWT_SECRET: ${file(./config.json):${opt:stage}.JWT_SECRET}
    MARKETING_URL: ${file(./config.json):${opt:stage}.MARKETING_URL}
    NODE_ENV: ${file(./config.json):${opt:stage}.NODE_ENV}
    REPLY_TO: ${file(./config.json):${opt:stage}.REPLY_TO}
  iamRoleStatements:
    - Effect: 'Allow'
      Action:
      - 'S3:*'
      Resource: '*'
    - Effect: 'Allow'
      Action:
      - 'ses:SendEmail'
      Resource: '*'

package:
  exclude:
    - '**/*.ts'
    - '*'
  include:
    - 'src/**/*.js'
    - 'src/**/*.md'
    - 'src/**/*.ejs'

plugins:
  - serverless-domain-manager
  - serverless-plugin-typescript
  - serverless-offline

functions:
  admin:
    description: 'Venzra Admin API'
    handler: src/lambda-admin.api
    events:
      - http: ANY /admin
      - http: ANY /admin/{proxy+}
  store:
    description: 'Venzra Store API'
    handler: src/lambda-store.api
    events:
      - http: ANY /store
      - http: ANY /store/{proxy+}
  website:
    description: 'Venzra Website API'
    handler: src/lambda-website.api
    events:
      - http: ANY /website
      - http: ANY /website/{proxy+}

custom:
  customDomain:
    domainName: ${file(./config.json):${opt:stage}.API_DOMAIN}
    basePath: ''
    stage: ${opt:stage}
    createRoute53Record: true
